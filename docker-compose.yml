services:
  api:
    build: .
    container_name: kutay-smart-cv-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kutay-smart-cv-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kutay-smart-cv-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_storage:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: kutay-smart-cv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_storage: